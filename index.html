<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Result Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SHREE DEVI INSTITUTE OF TECHNOLOGY</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Results</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <section class="main">
        <h2>Welcome to College Result Portal</h2>
        <br>
        <p>Enter your Roll Number to check your results</p>
        <br>

        <div class="result-box">
            <input type="text" id="rollNumber" placeholder="Enter Roll Number">
            <button id="checkResult">Check Result</button>
        </div>
        <br>
        <br>

        <div id="result" class="result-display"></div>
    </section>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        // Your Firebase Configuration (Corrected)
        const firebaseConfig = {
            apiKey: "AIzaSyA_n9vSJIhQ3XH2HJxtrg0YldDqa76eba8",
            authDomain: "fullstack-3bdfc.firebaseapp.com",
            projectId: "fullstack-3bdfc",
            storageBucket: "fullstack-3bdfc.appspot.com",
            messagingSenderId: "1012866377818",
            appId: "1:1012866377818:web:35add2b797b27490271063"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Handle Result Checking
        document.getElementById("checkResult").addEventListener("click", async function () {
            let rollNumber = document.getElementById("rollNumber").value.trim();

            if (rollNumber === "") {
                document.getElementById("result").innerHTML = "<p style='color:red;'>Please enter a roll number</p>";
                return;
            }

            try {
                // Corrected Collection Name from "students" → "results"
                const docRef = doc(db, "results", rollNumber);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    let data = docSnap.data();
                    document.getElementById("result").innerHTML = `
                        <h3>Result for ${data.name}</h3>
                        <p><strong>Roll No:</strong> ${rollNumber}</p>
                        <p><strong>Subject:</strong> ${data.subject}</p>
                        <p><strong>Marks:</strong> ${data.marks}</p>
                    `;
                } else {
                    document.getElementById("result").innerHTML = "<p style='color:red;'>No result found</p>";
                }
            } catch (error) {
                console.error("Error fetching result:", error);
                document.getElementById("result").innerHTML = "<p style='color:red;'>Error fetching result</p>";
            }
        });
    </script>
</body>
</html>
